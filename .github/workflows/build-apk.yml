name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      refresh_union_japanese:
        description: 'ユニアリ日本語名を更新する'
        required: true
        type: boolean
        default: false

  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'src/**'
      - 'scripts/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write

    steps:

      # ==========================================
      # リポジトリ取得
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # Java
      # ==========================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 現在のカードDBを準備
      # ==========================================

      - name: Prepare current Union card database
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.refresh_union_japanese == true
        run: |
          echo "Preparing Union Arena card database..."
          python3 scripts/build_card_data.py


      # ==========================================
      # ユニアリ日本語化
      # ==========================================

      - name: Build Union Arena Japanese mappings
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.refresh_union_japanese == true
        run: |
          echo "===================================="
          echo "Union Arena Japanese update"
          echo "===================================="

          python3 scripts/build_union_japanese.py

          echo ""
          echo "Japanese mapping process finished."

          if [ ! -f scripts/union_ja_names.json ]; then
            echo "ERROR: union_ja_names.json was not created."
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("scripts/union_ja_names.json"),
              Path("scripts/union_ja_ids.json"),
              Path("scripts/union_ja_set_map.json"),
          ]

          print("")
          print("====================================")
          print("Union Japanese mapping information")
          print("====================================")

          for path in files:

              if not path.exists():
                  print(path.name, ": not found")
                  continue

              try:
                  data = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  print(
                      path.name,
                      ":",
                      len(data)
                  )

              except Exception as error:

                  print(
                      path.name,
                      ": ERROR:",
                      error
                  )
          PY


      # ==========================================
      # 3種類の対応表をGitHubへ保存
      # ==========================================

      - name: Save Union Japanese mappings
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.refresh_union_japanese == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Saving Union Arena Japanese mapping files..."

          if [ -f scripts/union_ja_names.json ]; then
            git add scripts/union_ja_names.json
          fi

          if [ -f scripts/union_ja_ids.json ]; then
            git add scripts/union_ja_ids.json
          fi

          if [ -f scripts/union_ja_set_map.json ]; then
            git add scripts/union_ja_set_map.json
          fi

          echo ""
          echo "Files staged:"
          git diff --cached --name-only

          if git diff --cached --quiet; then

            echo "No Union Japanese mapping changes."

          else

            git commit \
              -m "Update Union Arena Japanese mappings [skip ci]"

            git push

            echo ""
            echo "Union Japanese mappings saved."

          fi


      # ==========================================
      # 日本語名を適用してカードDB再生成
      # ==========================================

      - name: Build bundled card database
        run: |
          echo "===================================="
          echo "Building card databases"
          echo "===================================="

          python3 scripts/build_card_data.py


      # ==========================================
      # カードDB情報
      # ==========================================

      - name: Show card database counts
        run: |
          echo "===================================="
          echo "Card database information"
          echo "===================================="

          if [ -f src/main/assets/card_data_build_info.json ]; then

            cat src/main/assets/card_data_build_info.json

          else

            echo "card_data_build_info.json not found"
            exit 1

          fi


      # ==========================================
      # ユニアリ日本語化件数確認
      # ==========================================

      - name: Show Union Japanese information
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          print("")
          print("====================================")
          print("Union Arena Japanese information")
          print("====================================")

          info_file = Path(
              "src/main/assets/card_data_build_info.json"
          )

          if info_file.exists():

              info = json.loads(
                  info_file.read_text(
                      encoding="utf-8"
                  )
              )

              union = (
                  info
                  .get("data", {})
                  .get("union", {})
              )

              print(
                  "Union cards:",
                  union.get(
                      "cards",
                      0
                  )
              )

              print(
                  "Union images:",
                  union.get(
                      "images",
                      0
                  )
              )

              print(
                  "Union Japanese names:",
                  union.get(
                      "japanese_names",
                      0
                  )
              )

          else:

              print(
                  "card_data_build_info.json not found"
              )

          print("")
          print("Mapping files:")

          mapping_files = [
              (
                  "Japanese names",
                  Path(
                      "scripts/union_ja_names.json"
                  )
              ),
              (
                  "Japanese IDs",
                  Path(
                      "scripts/union_ja_ids.json"
                  )
              ),
              (
                  "Set mappings",
                  Path(
                      "scripts/union_ja_set_map.json"
                  )
              ),
          ]

          for label, path in mapping_files:

              if not path.exists():

                  print(
                      label,
                      ": 0"
                  )

                  continue

              try:

                  data = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  print(
                      label,
                      ":",
                      len(data)
                  )

              except Exception as error:

                  print(
                      label,
                      ": ERROR:",
                      error
                  )
          PY


      # ==========================================
      # Gradle
      # ==========================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==========================================
      # APK作成
      # ==========================================

      - name: Build debug APK
        run: |
          echo "===================================="
          echo "Building Android APK"
          echo "===================================="

          gradle :app:assembleDebug --stacktrace


      # ==========================================
      # APK確認
      # ==========================================

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK was not created."
            exit 1

          fi

          echo "APK created successfully:"
          ls -lh "$APK"


      # ==========================================
      # APKアップロード
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tcg-deck-studio-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # 日本語化データ3種類をまとめて保存
      # ==========================================

      - name: Upload Union Japanese mappings
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.refresh_union_japanese == true
        uses: actions/upload-artifact@v4
        with:
          name: union-arena-japanese-maps
          path: |
            scripts/union_ja_names.json
            scripts/union_ja_ids.json
            scripts/union_ja_set_map.json
          if-no-files-found: warn
          retention-days: 30
