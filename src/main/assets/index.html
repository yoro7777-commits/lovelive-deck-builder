<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TCG Deck Studio</title>

<style>
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface2:#f0f2f5;
  --text:#202124;
  --muted:#777d87;
  --line:#e3e6eb;
  --accent:#ff4f87;
  --danger:#d63a45;
  --shadow:#00000012;
}

html[data-theme="dark"]{
  --bg:#0f1115;
  --surface:#191c22;
  --surface2:#242830;
  --text:#f5f6f8;
  --muted:#a5abb5;
  --line:#2b3039;
  --shadow:#00000055;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  padding-bottom:86px;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.top{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:11px 14px;
}

.toprow{
  display:flex;
  align-items:center;
  gap:11px;
}

.appicon{
  width:44px;
  height:44px;
  border-radius:13px;
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:900;
  background:linear-gradient(135deg,#7964ff,#ff4f87);
}

.apptitle{
  font-size:20px;
  font-weight:900;
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

main{
  max-width:1000px;
  margin:auto;
  padding:14px;
}

.panel{
  background:var(--surface);
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 14px var(--shadow);
}

.hero{
  padding:18px;
}

.hero h2{
  margin:0 0 7px;
  font-size:25px;
}

.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.55;
}

.gamegrid{
  display:grid;
  gap:10px;
  margin-top:16px;
}

.gamecard{
  border:1px solid var(--line);
  border-radius:17px;
  padding:12px;
  background:var(--surface);
  display:flex;
  align-items:center;
  gap:11px;
}

.gamecard.active{
  border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent);
}

.gamebadge{
  width:55px;
  height:55px;
  min-width:55px;
  border-radius:15px;
  color:#fff;
  font-weight:900;
  display:grid;
  place-items:center;
  text-align:center;
  line-height:1.05;
}

.g-love{
  background:linear-gradient(135deg,#ff4f87,#ff99bc);
}

.g-poke{
  background:linear-gradient(135deg,#356ed3,#e5b900);
}

.g-union{
  background:linear-gradient(135deg,#151515,#d42d37);
}

.gameinfo{
  flex:1;
  min-width:0;
}

.gameinfo b{
  font-size:17px;
}

.gameinfo small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  line-height:1.35;
}

.btn{
  border:0;
  border-radius:11px;
  padding:10px 12px;
  font-weight:800;
  background:var(--surface2);
  color:var(--text);
}

.btn.primary{
  color:#fff;
  background:var(--accent);
}

.btn.danger{
  color:#fff;
  background:var(--danger);
}

.btn.full{
  width:100%;
}

.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat{
  background:var(--surface);
  border-radius:15px;
  padding:12px 5px;
  text-align:center;
  box-shadow:0 2px 10px var(--shadow);
}

.stat b{
  display:block;
  font-size:20px;
}

.stat small{
  color:var(--muted);
  font-size:10px;
}

.sectiontitle{
  margin:17px 2px 9px;
  font-size:16px;
  font-weight:900;
}

.searchbox{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  background:var(--surface);
  color:var(--text);
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.filters select{
  min-width:0;
  border:1px solid var(--line);
  border-radius:11px;
  padding:10px;
  background:var(--surface);
  color:var(--text);
}

.cardgrid{
  display:grid;
  gap:10px;
}

.card{
  display:flex;
  gap:11px;
  padding:11px;
  border-radius:16px;
  background:var(--surface);
  box-shadow:0 2px 10px var(--shadow);
}

.thumb{
  width:78px;
  min-width:78px;
  aspect-ratio:5/7;
  border-radius:9px;
  overflow:hidden;
  background:var(--surface2);
  display:grid;
  place-items:center;
  text-align:center;
  font-size:10px;
  color:var(--muted);
  position:relative;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.thumb.clickable{
  cursor:pointer;
}

.cardbody{
  flex:1;
  min-width:0;
}

.name{
  font-size:16px;
  font-weight:900;
  line-height:1.3;
}

.meta{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
  word-break:break-all;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:6px;
}

.tag{
  border-radius:999px;
  padding:3px 7px;
  font-size:10px;
  background:var(--surface2);
}

.actions{
  display:flex;
  gap:6px;
  margin-top:8px;
  flex-wrap:wrap;
}

.deckgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.deckcard{
  background:var(--surface);
  border-radius:13px;
  padding:8px;
  box-shadow:0 2px 10px var(--shadow);
  position:relative;
}

.deckimage{
  position:relative;
  width:100%;
  aspect-ratio:5/7;
  border-radius:8px;
  overflow:hidden;
  background:var(--surface2);
  display:grid;
  place-items:center;
  color:var(--muted);
  font-size:10px;
  text-align:center;
}

.deckimage img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.qtybadge{
  position:absolute;
  right:5px;
  bottom:5px;
  background:#000c;
  color:#fff;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  padding:4px 8px;
}

.deckname{
  margin-top:6px;
  font-size:11px;
  font-weight:800;
  line-height:1.25;
  min-height:28px;
}

.deckcontrols{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-top:6px;
}

.deckcontrols button{
  border:0;
  border-radius:8px;
  width:30px;
  height:30px;
  background:var(--accent);
  color:#fff;
  font-size:18px;
}

.deckcontrols b{
  min-width:20px;
  text-align:center;
}

.rule{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}

.rule:last-child{
  border-bottom:0;
}

.ok{
  color:#1b9655;
  font-weight:900;
}

.warn{
  color:#b97a00;
  font-weight:900;
}

.bad{
  color:#d53b45;
  font-weight:900;
}

.slot{
  display:flex;
  gap:7px;
  align-items:center;
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px;
  margin-top:8px;
}

.slot.active{
  border-color:var(--accent);
}

.slot input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-weight:800;
}

textarea{
  width:100%;
  min-height:160px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--surface);
  color:var(--text);
  padding:10px;
  font-family:monospace;
  font-size:12px;
}

.note{
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

.empty{
  padding:28px 10px;
  text-align:center;
  color:var(--muted);
  border-radius:15px;
  background:var(--surface);
}

.bottom{
  position:fixed;
  z-index:60;
  left:0;
  right:0;
  bottom:0;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:var(--surface);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}

.bottom button{
  background:transparent;
  border:0;
  color:var(--muted);
  padding:8px 2px 7px;
  font-size:10px;
}

.bottom .ico{
  display:block;
  font-size:21px;
  margin-bottom:2px;
}

.bottom button.active{
  color:var(--accent);
  font-weight:900;
}

.hidden{
  display:none!important;
}

/* 画像プレビュー */
.preview{
  position:fixed;
  z-index:999;
  inset:0;
  background:#000d;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.preview.show{
  display:flex;
}

.previewbox{
  width:min(94vw,480px);
  max-height:94vh;
  background:var(--surface);
  color:var(--text);
  border-radius:18px;
  padding:12px;
  overflow:auto;
  box-shadow:0 15px 60px #000a;
}

.previewtop{
  display:flex;
  justify-content:flex-end;
}

.previewclose{
  border:0;
  background:var(--surface2);
  color:var(--text);
  border-radius:10px;
  padding:8px 12px;
  font-weight:900;
}

.previewimg{
  width:100%;
  max-height:72vh;
  object-fit:contain;
  display:block;
  margin:auto;
  border-radius:10px;
  background:#111;
}

.previewname{
  text-align:center;
  font-size:17px;
  font-weight:900;
  margin-top:10px;
}

.previewmeta{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

@media(min-width:540px){
  .deckgrid{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(min-width:760px){
  .gamegrid{
    grid-template-columns:repeat(3,1fr);
  }

  .cardgrid{
    grid-template-columns:1fr 1fr;
  }

  .deckgrid{
    grid-template-columns:repeat(6,1fr);
  }

  .filters{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="toprow">
    <div class="appicon">TCG</div>

    <div>
      <div class="apptitle">TCG Deck Studio</div>
      <div class="subtitle" id="gameLabel">
        ラブカ・ポケカ・ユニアリ対応
      </div>
    </div>
  </div>
</header>

<main>

<section id="homeView">

  <div class="panel hero">
    <h2>デッキを、ひとつのアプリで。</h2>

    <p>
      ラブカ・ポケカ・ユニアリを切り替えて、
      カード検索・画像確認・デッキ作成・保存ができます。
    </p>

    <div id="gameChooser" class="gamegrid"></div>
  </div>

  <div class="quick">
    <div class="stat">
      <b id="homeCards">0</b>
      <small>登録カード</small>
    </div>

    <div class="stat">
      <b id="homeDeck">0</b>
      <small>デッキ枚数</small>
    </div>

    <div class="stat">
      <b id="homeSlots">0/5</b>
      <small>保存デッキ</small>
    </div>
  </div>

  <div class="sectiontitle">
    すぐに始める
  </div>

  <div class="panel">
    <button
      class="btn primary full"
      onclick="showView('search')">
      カードを検索してデッキを作る
    </button>
  </div>

</section>


<section id="searchView" class="hidden">

  <div class="panel">

    <input
      id="searchBox"
      class="searchbox"
      type="search"
      placeholder="カード名・カード番号で検索"
      oninput="renderCards()">

    <div class="filters">

      <select id="typeFilter" onchange="renderCards()">
        <option value="">全タイプ</option>
      </select>

      <select id="seriesFilter" onchange="renderCards()">
        <option value="">全シリーズ</option>
      </select>

      <select id="rarityFilter" onchange="renderCards()">
        <option value="">全レアリティ</option>
      </select>

    </div>
  </div>

  <div class="quick">

    <div class="stat">
      <b id="dbCount">0</b>
      <small>カードDB</small>
    </div>

    <div class="stat">
      <b id="hitCount">0</b>
      <small>検索結果</small>
    </div>

    <div class="stat">
      <b id="deckBadge">0</b>
      <small>デッキ枚数</small>
    </div>

  </div>

  <div class="sectiontitle">
    カード一覧
  </div>

  <div id="cardList" class="cardgrid"></div>

</section>


<section id="deckView" class="hidden">

  <div class="panel">
    <input
      id="deckName"
      class="searchbox"
      placeholder="デッキ名"
      oninput="renameCurrentDeck()">
  </div>

  <div id="rulePanel" class="panel"></div>

  <div class="sectiontitle">
    デッキ画像一覧
  </div>

  <div id="deckGrid" class="deckgrid"></div>

  <div class="panel" style="margin-top:12px">

    <button class="btn primary" onclick="exportDeck()">
      レシピを書き出す
    </button>

    <button class="btn" onclick="copyDeck()">
      コピー
    </button>

    <button class="btn danger" onclick="clearDeck()">
      全削除
    </button>

    <textarea
      id="deckText"
      style="margin-top:10px"
      placeholder="デッキレシピ">
    </textarea>

  </div>

</section>


<section id="savedView" class="hidden">

  <div class="panel">

    <b>保存デッキ</b>

    <p class="note">
      各TCG最大5スロットまで保存できます。
    </p>

    <div id="slotList"></div>

    <button
      class="btn primary full"
      style="margin-top:10px"
      onclick="newDeckSlot()">
      新しいデッキを作る
    </button>

  </div>

</section>


<section id="settingsView" class="hidden">

  <div class="panel">

    <b>表示設定</b>

    <p class="note">
      ライト / ダーク / 端末設定に合わせる
    </p>

    <select
      id="themeSelect"
      class="searchbox"
      onchange="setTheme(this.value)">

      <option value="system">
        端末設定に合わせる
      </option>

      <option value="light">
        ライトモード
      </option>

      <option value="dark">
        ダークモード
      </option>

    </select>

  </div>

  <div class="panel">

    <b>カードデータ</b>

    <p id="dbInfo" class="note"></p>

    <button
      class="btn danger"
      onclick="forceRefreshDatabase()">
      カードDBを最新版に更新
    </button>

  </div>

</section>

</main>


<nav class="bottom">

<button
  id="navHome"
  class="active"
  onclick="showView('home')">
  <span class="ico">⌂</span>
  ホーム
</button>

<button
  id="navSearch"
  onclick="showView('search')">
  <span class="ico">⌕</span>
  検索
</button>

<button
  id="navDeck"
  onclick="showView('deck')">
  <span class="ico">▣</span>
  デッキ
</button>

<button
  id="navSaved"
  onclick="showView('saved')">
  <span class="ico">▤</span>
  保存
</button>

<button
  id="navSettings"
  onclick="showView('settings')">
  <span class="ico">⚙</span>
  設定
</button>

</nav>


<!-- 画像プレビュー -->
<div
  id="preview"
  class="preview"
  onclick="previewBackground(event)">

  <div class="previewbox">

    <div class="previewtop">
      <button
        class="previewclose"
        onclick="closePreview()">
        ✕ 閉じる
      </button>
    </div>

    <img
      id="previewImage"
      class="previewimg">

    <div
      id="previewName"
      class="previewname">
    </div>

    <div
      id="previewMeta"
      class="previewmeta">
    </div>

  </div>

</div>


<script src="cards_loveca.js"></script>
<script src="cards_pokemon.js"></script>
<script src="cards_union.js"></script>

<script>

const CARD_DATA_VERSION = 9;


const GAME = {

  loveca:{
    name:"ラブカ",
    full:"ラブライブ！オフィシャルカードゲーム",
    accent:"#ff4f87",
    badge:"g-love",
    short:"ラブ<br>カ",
    target:60
  },

  pokemon:{
    name:"ポケカ",
    full:"ポケモンカードゲーム",
    accent:"#346fd2",
    badge:"g-poke",
    short:"ポケ<br>カ",
    target:60
  },

  union:{
    name:"ユニアリ",
    full:"UNION ARENA",
    accent:"#d42d37",
    badge:"g-union",
    short:"UA",
    target:50
  }

};


function clone(x){
  return JSON.parse(JSON.stringify(x));
}


function loadJSON(key,fallback){

  try{

    const x = localStorage.getItem(key);

    if(!x){
      return clone(fallback);
    }

    return JSON.parse(x);

  }catch(e){

    return clone(fallback);

  }

}


function bundledDatabase(){

  return {

    loveca:
      window.TCG_CARD_DATA?.loveca || [],

    pokemon:
      window.TCG_CARD_DATA?.pokemon || [],

    union:
      window.TCG_CARD_DATA?.union || []

  };

}


function migrateDatabase(){

  const bundled = bundledDatabase();

  const version =
    Number(
      localStorage.getItem(
        "tdsDataVersion"
      ) || 0
    );

  if(version < CARD_DATA_VERSION){

    localStorage.setItem(
      "tdsDb",
      JSON.stringify(bundled)
    );

    localStorage.setItem(
      "tdsDataVersion",
      String(CARD_DATA_VERSION)
    );

    return bundled;

  }

  const old =
    loadJSON(
      "tdsDb",
      bundled
    );

  /*
    旧データに画像URLが無い場合、
    APK同梱最新版で画像だけ補完。
  */
  for(const game of Object.keys(GAME)){

    const latest =
      bundled[game] || [];

    const oldMap =
      new Map(
        (old[game] || [])
        .map(c=>[
          String(c.id),
          c
        ])
      );

    for(const c of latest){

      const id =
        String(c.id || "");

      if(!id){
        continue;
      }

      const existing =
        oldMap.get(id);

      if(!existing){

        oldMap.set(id,c);

      }else{

        oldMap.set(
          id,
          {
            ...c,
            ...existing,
            image:
              existing.image ||
              c.image ||
              c.imageUrl ||
              c.image_url ||
              ""
          }
        );

      }

    }

    old[game] =
      [...oldMap.values()];

  }

  localStorage.setItem(
    "tdsDb",
    JSON.stringify(old)
  );

  return old;

}


let db = migrateDatabase();

let currentGame =
  localStorage.getItem("tdsGame")
  || "loveca";


let state =
  loadJSON(
    "tdsDeckState",
    {
      loveca:{
        active:0,
        slots:[]
      },
      pokemon:{
        active:0,
        slots:[]
      },
      union:{
        active:0,
        slots:[]
      }
    }
  );


for(const g of Object.keys(GAME)){

  if(!state[g]){

    state[g] = {
      active:0,
      slots:[]
    };

  }

  if(!state[g].slots.length){

    state[g].slots.push(
      makeSlot(
        GAME[g].name + "デッキ"
      )
    );

  }

}


function makeSlot(name){

  return {
    name:name,
    cards:{}
  };

}


function deck(){

  const s =
    state[currentGame];

  if(!s.slots[s.active]){

    s.slots[s.active] =
      makeSlot(
        GAME[currentGame].name
        + "デッキ"
      );

  }

  return s.slots[s.active];

}


function save(){

  localStorage.setItem(
    "tdsGame",
    currentGame
  );

  localStorage.setItem(
    "tdsDb",
    JSON.stringify(db)
  );

  localStorage.setItem(
    "tdsDeckState",
    JSON.stringify(state)
  );

  updateStats();

}


function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      c=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

}


function js(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


function normalizeImage(c){

  let img =
    c?.image ||
    c?.imageUrl ||
    c?.image_url ||
    "";

  if(typeof img !== "string"){
    return "";
  }

  img = img.trim();

  if(
    !img.startsWith("http://")
    &&
    !img.startsWith("https://")
  ){
    return "";
  }

  return img;

}


function chooseGame(game){

  currentGame = game;

  document.documentElement
    .style
    .setProperty(
      "--accent",
      GAME[game].accent
    );

  save();

  renderChooser();

  buildFilters();

  renderCards();

  renderDeck();

  renderSlots();

}


function renderChooser(){

  document.getElementById(
    "gameChooser"
  ).innerHTML =

  Object.entries(GAME)
  .map(([key,g])=>`

    <div class="
      gamecard
      ${key===currentGame
        ? "active"
        : ""}
    ">

      <div class="
        gamebadge ${g.badge}
      ">
        ${g.short}
      </div>

      <div class="gameinfo">

        <b>${g.name}</b>

        <small>
          ${g.full}
        </small>

      </div>

      <button
        class="
          btn
          ${key===currentGame
            ? "primary"
            : ""}
        "
        onclick="chooseGame('${key}')">

        ${key===currentGame
          ? "選択中"
          : "選ぶ"}

      </button>

    </div>

  `)
  .join("");

}


function showView(view){

  const views =
    [
      "home",
      "search",
      "deck",
      "saved",
      "settings"
    ];

  for(const x of views){

    document
      .getElementById(
        x + "View"
      )
      .classList
      .toggle(
        "hidden",
        x !== view
      );

    document
      .getElementById(
        "nav"
        + x[0].toUpperCase()
        + x.slice(1)
      )
      .classList
      .toggle(
        "active",
        x === view
      );

  }

  if(view==="search"){
    renderCards();
  }

  if(view==="deck"){
    renderDeck();
  }

  if(view==="saved"){
    renderSlots();
  }

  if(view==="settings"){
    renderSettings();
  }

}


function updateStats(){

  const d = deck();

  const total =
    Object.values(d.cards)
      .reduce(
        (a,b)=>a+b,
        0
      );

  document.getElementById(
    "gameLabel"
  ).textContent =
    GAME[currentGame].full
    + " / "
    + d.name;

  document.getElementById(
    "homeCards"
  ).textContent =
    (db[currentGame] || [])
    .length;

  document.getElementById(
    "homeDeck"
  ).textContent =
    total;

  document.getElementById(
    "homeSlots"
  ).textContent =
    state[currentGame]
      .slots.length
    + "/5";

  document.getElementById(
    "deckBadge"
  ).textContent =
    total;

}


function buildFilters(){

  const arr =
    db[currentGame] || [];

  fillFilter(
    "typeFilter",
    arr
      .map(c=>c.type)
      .filter(Boolean)
  );

  fillFilter(
    "seriesFilter",
    arr
      .map(
        c=>
          c.series ||
          c.product ||
          c.title
      )
      .filter(Boolean)
  );

  fillFilter(
    "rarityFilter",
    arr
      .map(c=>c.rarity)
      .filter(Boolean)
  );

}


function fillFilter(
  id,
  values
){

  const el =
    document.getElementById(id);

  const selected =
    el.value;

  const first =
    el.options[0].outerHTML;

  const unique =
    [...new Set(values)]
    .sort(
      (a,b)=>
        String(a)
        .localeCompare(
          String(b),
          "ja"
        )
    );

  el.innerHTML =
    first
    +
    unique
      .map(
        x=>
        `<option value="${esc(x)}">
          ${esc(x)}
        </option>`
      )
      .join("");

  if(
    unique.includes(selected)
  ){
    el.value = selected;
  }

}


function renderCards(){

  const q =
    (
      document
      .getElementById(
        "searchBox"
      )
      .value || ""
    )
    .toLowerCase();

  const type =
    document
    .getElementById(
      "typeFilter"
    )
    .value;

  const series =
    document
    .getElementById(
      "seriesFilter"
    )
    .value;

  const rarity =
    document
    .getElementById(
      "rarityFilter"
    )
    .value;

  const arr =
    db[currentGame] || [];

  const filtered =
    arr.filter(c=>{

      const text = [
        c.name,
        c.name_en,
        c.id,
        c.type,
        c.series,
        c.product,
        c.title,
        c.rarity,
        c.regulation
      ]
      .join(" ")
      .toLowerCase();

      return (
        (!q || text.includes(q))
        &&
        (!type || c.type===type)
        &&
        (
          !series ||
          (
            c.series ||
            c.product ||
            c.title
          )===series
        )
        &&
        (
          !rarity ||
          c.rarity===rarity
        )
      );

    });

  document.getElementById(
    "dbCount"
  ).textContent =
    arr.length;

  document.getElementById(
    "hitCount"
  ).textContent =
    filtered.length;

  document.getElementById(
    "cardList"
  ).innerHTML =

    filtered.length

    ? filtered
        .slice(0,300)
        .map(cardHtml)
        .join("")

    : `
      <div class="empty">
        該当カードがありません
      </div>
    `;

  updateStats();

}


function cardHtml(c){

  const count =
    deck().cards[c.id] || 0;

  const image =
    normalizeImage(c);

  const imageHTML =

    image

    ? `
      <img
        src="${esc(image)}"
        loading="lazy"
        onclick="
          openPreview(
            '${js(c.id)}'
          )
        "
        onerror="
          this.style.display='none';
          this.parentNode.innerHTML='画像なし';
        ">
    `

    : "画像なし";

  return `

    <article class="card">

      <div class="
        thumb
        ${image ? "clickable" : ""}
      ">
        ${imageHTML}
      </div>

      <div class="cardbody">

        <div class="name">
          ${esc(c.name)}
        </div>

        <div class="meta">
          ${esc(c.id)}
        </div>

        <div class="tags">

          ${
            c.type
            ? `
              <span class="tag">
                ${esc(c.type)}
              </span>
            `
            : ""
          }

          ${
            (
              c.series ||
              c.product ||
              c.title
            )
            ? `
              <span class="tag">
                ${esc(
                  c.series ||
                  c.product ||
                  c.title
                )}
              </span>
            `
            : ""
          }

          ${
            c.rarity
            ? `
              <span class="tag">
                ${esc(c.rarity)}
              </span>
            `
            : ""
          }

        </div>

        <div class="actions">

          ${
            image
            ? `
              <button
                class="btn"
                onclick="
                  openPreview(
                    '${js(c.id)}'
                  )
                ">
                画像
              </button>
            `
            : ""
          }

          <button
            class="btn primary"
            onclick="
              addCard(
                '${js(c.id)}'
              )
            ">
            ＋ 追加
            ${count
              ? `(${count})`
              : ""}
          </button>

          ${
            count
            ? `
              <button
                class="btn"
                onclick="
                  removeCard(
                    '${js(c.id)}'
                  )
                ">
                −
              </button>
            `
            : ""
          }

        </div>

      </div>

    </article>

  `;

}


function maxCopies(card){

  if(
    currentGame==="pokemon"
    &&
    String(card.type || "")
      .includes("基本エネルギー")
  ){
    return 99;
  }

  return 4;

}


function addCard(id){

  const card =
    (db[currentGame] || [])
    .find(
      c=>String(c.id)===String(id)
    );

  if(!card){
    return;
  }

  const d = deck();

  const count =
    d.cards[id] || 0;

  const limit =
    maxCopies(card);

  if(count >= limit){

    alert(
      limit===4
      ? "このカードは4枚までです"
      : "上限に達しました"
    );

    return;

  }

  d.cards[id] =
    count + 1;

  save();

  renderCards();

  renderDeck();

}


function removeCard(id){

  const d = deck();

  if(!d.cards[id]){
    return;
  }

  d.cards[id]--;

  if(d.cards[id] <= 0){

    delete d.cards[id];

  }

  save();

  renderCards();

  renderDeck();

}


function renderDeck(){

  const d = deck();

  document.getElementById(
    "deckName"
  ).value =
    d.name;

  const arr =
    db[currentGame] || [];

  const entries =
    Object.entries(d.cards)
      .map(([id,count])=>{

        return {
          id,
          count,
          card:
            arr.find(
              c=>
                String(c.id)
                ===
                String(id)
            )
        };

      })
      .filter(x=>x.card);

  const total =
    entries.reduce(
      (sum,x)=>
        sum+x.count,
      0
    );

  const target =
    GAME[currentGame].target;

  document.getElementById(
    "rulePanel"
  ).innerHTML = `

    <div class="rule">

      <span>
        デッキ枚数
      </span>

      <span class="
        ${
          total===target
          ? "ok"
          : total>target
            ? "bad"
            : "warn"
        }
      ">

        ${total}/${target}

        ${
          total===target
          ? " ✓"
          : ""
        }

      </span>

    </div>

  `;

  document.getElementById(
    "deckGrid"
  ).innerHTML =

    entries.length

    ? entries
        .map(deckCardHtml)
        .join("")

    : `
      <div
        class="empty"
        style="grid-column:1/-1">
        デッキにカードがありません
      </div>
    `;

  updateStats();

}


function deckCardHtml(x){

  const c =
    x.card;

  const image =
    normalizeImage(c);

  return `

    <div class="deckcard">

      <div
        class="deckimage"
        ${
          image
          ? `
            onclick="
              openPreview(
                '${js(c.id)}'
              )
            "
          `
          : ""
        }
      >

        ${
          image
          ? `
            <img
              src="${esc(image)}"
              loading="lazy"
              onerror="
                this.style.display='none';
                this.parentNode.innerHTML='画像なし';
              ">
          `
          : "画像なし"
        }

        <span class="qtybadge">
          ×${x.count}
        </span>

      </div>

      <div class="deckname">
        ${esc(c.name)}
      </div>

      <div class="deckcontrols">

        <button
          onclick="
            removeCard(
              '${js(c.id)}'
            )
          ">
          −
        </button>

        <b>
          ${x.count}
        </b>

        <button
          onclick="
            addCard(
              '${js(c.id)}'
            )
          ">
          ＋
        </button>

      </div>

    </div>

  `;

}


function openPreview(id){

  const card =
    (db[currentGame] || [])
    .find(
      c=>
        String(c.id)
        ===
        String(id)
    );

  if(!card){
    return;
  }

  const image =
    normalizeImage(card);

  if(!image){

    alert(
      "このカードには画像がありません"
    );

    return;
  }

  document.getElementById(
    "previewImage"
  ).src =
    image;

  document.getElementById(
    "previewName"
  ).textContent =
    card.name || "";

  document.getElementById(
    "previewMeta"
  ).textContent =
    card.id || "";

  document.getElementById(
    "preview"
  ).classList.add("show");

}


function closePreview(){

  document.getElementById(
    "preview"
  ).classList.remove("show");

  document.getElementById(
    "previewImage"
  ).src = "";

}


function previewBackground(e){

  if(
    e.target.id === "preview"
  ){
    closePreview();
  }

}


function renameCurrentDeck(){

  deck().name =
    document.getElementById(
      "deckName"
    ).value
    ||
    GAME[currentGame].name
    + "デッキ";

  save();

}


function clearDeck(){

  if(
    !confirm(
      "現在のデッキを全削除しますか？"
    )
  ){
    return;
  }

  deck().cards = {};

  save();

  renderDeck();

  renderCards();

}


function exportDeck(){

  const d = deck();

  const arr =
    db[currentGame] || [];

  let text =
    GAME[currentGame].full
    + "\n"
    + d.name
    + "\n\n";

  for(
    const [id,count]
    of Object.entries(d.cards)
  ){

    const card =
      arr.find(
        c=>
          String(c.id)
          ===
          String(id)
      );

    if(card){

      text +=
        count
        + " x "
        + card.name
        + " ("
        + id
        + ")\n";

    }

  }

  document.getElementById(
    "deckText"
  ).value =
    text;

}


function copyDeck(){

  exportDeck();

  const t =
    document.getElementById(
      "deckText"
    );

  t.focus();

  t.select();

  try{

    document.execCommand(
      "copy"
    );

    alert(
      "コピーしました"
    );

  }catch(e){

    alert(
      "長押ししてコピーしてください"
    );

  }

}


function renderSlots(){

  const s =
    state[currentGame];

  document.getElementById(
    "slotList"
  ).innerHTML =

    s.slots
      .map(
        (slot,index)=>`

          <div class="
            slot
            ${
              index===s.active
              ? "active"
              : ""
            }
          ">

            <input
              value="${esc(slot.name)}"
              onchange="
                renameSlot(
                  ${index},
                  this.value
                )
              ">

            <button
              class="
                btn
                ${
                  index===s.active
                  ? "primary"
                  : ""
                }
              "
              onclick="
                activateSlot(
                  ${index}
                )
              ">

              ${
                index===s.active
                ? "編集中"
                : "開く"
              }

            </button>

            ${
              s.slots.length>1
              ? `
                <button
                  class="btn danger"
                  onclick="
                    deleteSlot(
                      ${index}
                    )
                  ">
                  削除
                </button>
              `
              : ""
            }

          </div>

        `
      )
      .join("");

  updateStats();

}


function newDeckSlot(){

  const s =
    state[currentGame];

  if(s.slots.length >= 5){

    alert(
      "保存スロットは5個までです"
    );

    return;

  }

  s.slots.push(

    makeSlot(
      GAME[currentGame].name
      + "デッキ "
      + (s.slots.length+1)
    )

  );

  s.active =
    s.slots.length - 1;

  save();

  renderSlots();

  renderDeck();

}


function activateSlot(index){

  state[currentGame]
    .active =
    index;

  save();

  renderSlots();

  renderDeck();

}


function renameSlot(
  index,
  value
){

  state[currentGame]
    .slots[index]
    .name =
    value
    ||
    GAME[currentGame].name
    + "デッキ";

  save();

}


function deleteSlot(index){

  if(
    !confirm(
      "このデッキを削除しますか？"
    )
  ){
    return;
  }

  const s =
    state[currentGame];

  s.slots.splice(
    index,
    1
  );

  s.active =
    Math.max(
      0,
      Math.min(
        s.active,
        s.slots.length-1
      )
    );

  save();

  renderSlots();

  renderDeck();

}


function forceRefreshDatabase(){

  if(
    !confirm(
      "カードデータをAPK同梱最新版へ更新しますか？\n保存デッキは消えません。"
    )
  ){
    return;
  }

  db =
    bundledDatabase();

  localStorage.setItem(
    "tdsDb",
    JSON.stringify(db)
  );

  localStorage.setItem(
    "tdsDataVersion",
    String(CARD_DATA_VERSION)
  );

  buildFilters();

  renderCards();

  renderDeck();

  renderSettings();

  updateStats();

  alert(
    "カードDBを更新しました"
  );

}


function renderSettings(){

  document.getElementById(
    "dbInfo"
  ).textContent =

    "ラブカ "
    + (db.loveca || []).length
    + "件 / ポケカ "
    + (db.pokemon || []).length
    + "件 / ユニアリ "
    + (db.union || []).length
    + "件";

  document.getElementById(
    "themeSelect"
  ).value =
    localStorage.getItem(
      "tdsTheme"
    )
    || "system";

}


function applyTheme(mode){

  const dark =
    mode==="dark"
    ||
    (
      mode==="system"
      &&
      window.matchMedia
      &&
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches
    );

  document.documentElement
    .setAttribute(
      "data-theme",
      dark
      ? "dark"
      : "light"
    );

}


function setTheme(mode){

  localStorage.setItem(
    "tdsTheme",
    mode
  );

  applyTheme(mode);

}


const theme =
  localStorage.getItem(
    "tdsTheme"
  )
  || "system";

applyTheme(theme);


if(window.matchMedia){

  const mq =
    window.matchMedia(
      "(prefers-color-scheme: dark)"
    );

  if(mq.addEventListener){

    mq.addEventListener(
      "change",
      ()=>{

        if(
          (
            localStorage.getItem(
              "tdsTheme"
            )
            || "system"
          )
          ===
          "system"
        ){

          applyTheme(
            "system"
          );

        }

      }
    );

  }

}


document.documentElement
  .style
  .setProperty(
    "--accent",
    GAME[currentGame].accent
  );


renderChooser();

buildFilters();

renderCards();

renderDeck();

renderSlots();

renderSettings();

updateStats();

</script>
