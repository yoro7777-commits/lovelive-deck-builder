<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TCG Deck Studio</title>

<style>
:root{
  --bg:#f6f7fb;
  --surface:#fff;
  --surface2:#f1f3f7;
  --text:#202124;
  --muted:#747985;
  --line:#e3e6ec;
  --accent:#ff4f87;
  --danger:#d53d46;
  --shadow:0 4px 18px #00000012;
}
html[data-theme="dark"]{
  --bg:#101217;
  --surface:#191c23;
  --surface2:#252933;
  --text:#f7f8fa;
  --muted:#a9afba;
  --line:#303641;
  --shadow:0 4px 18px #00000055;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{padding-bottom:82px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.top{
  max-width:1200px;
  margin:auto;
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:12px;
}
.appmark{
  width:48px;
  height:48px;
  border-radius:14px;
  background:linear-gradient(135deg,#10142e,#e52b36);
  color:#fff;
  display:grid;
  place-items:center;
  text-align:center;
  font-weight:900;
  font-size:11px;
  line-height:1.05;
}
.top-title{
  flex:1;
}
.top-title h1{
  margin:0;
  font-size:21px;
}
.top-title small{
  color:var(--muted);
}
.top-stats{
  display:flex;
  gap:8px;
}
.top-stat{
  background:var(--surface2);
  border-radius:12px;
  padding:7px 10px;
  text-align:center;
  font-size:10px;
}
.top-stat b{
  display:block;
  font-size:15px;
}

main{
  max-width:1200px;
  margin:auto;
  padding:14px;
}
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:14px;
  margin-bottom:14px;
}
.section-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:12px;
}

.game-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
.game-card{
  border:2px solid var(--line);
  border-radius:20px;
  padding:13px;
  background:var(--surface);
}
.game-card.active{
  border-color:var(--accent);
}
.game-main{
  display:flex;
  align-items:center;
  gap:13px;
}
.game-icon{
  width:96px;
  height:96px;
  border-radius:19px;
  object-fit:cover;
  box-shadow:0 5px 15px #0002;
}
.game-info{
  flex:1;
}
.game-info h2{
  margin:0 0 5px;
  font-size:24px;
}
.game-info p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}
.game-card button{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:999px;
  padding:12px;
  color:#fff;
  font-weight:900;
}
.loveca-btn{background:#ff4f87}
.pokemon-btn{background:#1767d8}
.union-btn{background:#df2028}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.quick-btn{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:16px;
  padding:15px 8px;
  text-align:center;
  font-weight:800;
}
.quick-btn .ico{
  display:block;
  font-size:28px;
  margin-bottom:5px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.stat{
  background:var(--surface);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:13px 7px;
  text-align:center;
}
.stat b{
  font-size:20px;
  display:block;
}
.stat small{
  color:var(--muted);
  font-size:10px;
}

.searchbox{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  background:var(--surface);
  color:var(--text);
}
.filters{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-top:10px;
}
.filters select{
  border:1px solid var(--line);
  border-radius:11px;
  padding:10px;
  background:var(--surface);
  color:var(--text);
}

.card-grid{
  display:grid;
  gap:10px;
}
.card{
  display:flex;
  gap:10px;
  background:var(--surface);
  border-radius:16px;
  padding:10px;
  box-shadow:var(--shadow);
}
.thumb{
  width:82px;
  min-width:82px;
  aspect-ratio:5/7;
  background:var(--surface2);
  border-radius:9px;
  overflow:hidden;
  display:grid;
  place-items:center;
  color:var(--muted);
  font-size:10px;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.card-body{
  flex:1;
  min-width:0;
}
.card-name{
  font-weight:900;
  font-size:16px;
}
.meta{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:6px;
}
.tag{
  background:var(--surface2);
  padding:3px 7px;
  border-radius:999px;
  font-size:10px;
}
.actions{
  margin-top:7px;
  display:flex;
  gap:6px;
}
.btn{
  border:0;
  border-radius:10px;
  padding:8px 10px;
  font-weight:800;
  background:var(--surface2);
  color:var(--text);
}
.btn.primary{
  background:var(--accent);
  color:#fff;
}
.btn.danger{
  background:var(--danger);
  color:#fff;
}

.deck-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.deck-card{
  background:var(--surface);
  border-radius:13px;
  padding:7px;
  box-shadow:var(--shadow);
}
.deck-img{
  position:relative;
  aspect-ratio:5/7;
  border-radius:8px;
  overflow:hidden;
  background:var(--surface2);
  display:grid;
  place-items:center;
  font-size:10px;
  color:var(--muted);
}
.deck-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.qty{
  position:absolute;
  right:4px;
  bottom:4px;
  border-radius:999px;
  background:#000c;
  color:#fff;
  font-weight:900;
  padding:4px 7px;
}
.deck-name{
  font-size:10px;
  font-weight:800;
  margin-top:5px;
  min-height:27px;
}
.deck-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  margin-top:5px;
}
.deck-controls button{
  width:28px;
  height:28px;
  border:0;
  border-radius:8px;
  background:var(--accent);
  color:#fff;
}

.preview{
  position:fixed;
  inset:0;
  z-index:999;
  background:#000d;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.preview.show{display:flex}
.preview-box{
  width:min(94vw,480px);
  max-height:94vh;
  overflow:auto;
  background:var(--surface);
  border-radius:18px;
  padding:12px;
}
.preview-box img{
  width:100%;
  max-height:75vh;
  object-fit:contain;
}
.preview-title{
  margin-top:8px;
  text-align:center;
  font-weight:900;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:80;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:var(--surface);
  border-top:1px solid var(--line);
}
.bottom button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 2px;
  font-size:10px;
}
.bottom button.active{
  color:var(--accent);
  font-weight:900;
}
.bottom span{
  display:block;
  font-size:20px;
}

.hidden{display:none!important}

textarea{
  width:100%;
  min-height:150px;
  margin-top:10px;
  padding:10px;
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:12px;
}

@media(min-width:650px){
  .game-grid{grid-template-columns:repeat(3,1fr)}
  .quick-grid{grid-template-columns:repeat(4,1fr)}
  .filters{grid-template-columns:repeat(3,1fr)}
  .card-grid{grid-template-columns:repeat(2,1fr)}
  .deck-grid{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>

<body>

<header>
<div class="top">

<div class="appmark">
TCG<br>DECK
</div>

<div class="top-title">
<h1>TCG Deck Studio</h1>
<small>ラブカ・ポケカ・ユニアリ対応 デッキビルダー</small>
</div>

<div class="top-stats">
<div class="top-stat">
カードDB
<b id="topCardCount">0</b>
</div>
<div class="top-stat">
デッキ
<b id="topDeckCount">0</b>
</div>
</div>

</div>
</header>

<main>

<section id="homeView">

<div class="panel">

<div class="section-title">
ゲームを選択してください
</div>

<div class="game-grid">

<div id="game-loveca" class="game-card">
<div class="game-main">

<img
class="game-icon"
src="game_loveca.png"
onerror="this.style.display='none'">

<div class="game-info">
<h2 style="color:#ff4f87">ラブカ</h2>
<p>ラブライブ！オフィシャルカードゲーム</p>
</div>

</div>

<button class="loveca-btn" onclick="chooseGame('loveca')">
選択する
</button>
</div>

<div id="game-pokemon" class="game-card">
<div class="game-main">

<img
class="game-icon"
src="game_pokemon.png"
onerror="this.style.display='none'">

<div class="game-info">
<h2 style="color:#1767d8">ポケカ</h2>
<p>ポケモンカードゲーム</p>
</div>

</div>

<button class="pokemon-btn" onclick="chooseGame('pokemon')">
選択する
</button>
</div>

<div id="game-union" class="game-card">
<div class="game-main">

<img
class="game-icon"
src="game_union.png"
onerror="this.style.display='none'">

<div class="game-info">
<h2 style="color:#df2028">ユニアリ</h2>
<p>UNION ARENA</p>
</div>

</div>

<button class="union-btn" onclick="chooseGame('union')">
選択する
</button>
</div>

</div>
</div>

<div class="panel">

<div class="section-title">
クイックメニュー
</div>

<div class="quick-grid">

<button class="quick-btn" onclick="showView('search')">
<span class="ico">⌕</span>
カード検索
</button>

<button class="quick-btn" onclick="showView('deck')">
<span class="ico">▣</span>
デッキ編集
</button>

<button class="quick-btn" onclick="exportDeck();showView('deck')">
<span class="ico">▤</span>
レシピ出力
</button>

<button class="quick-btn" onclick="showView('saved')">
<span class="ico">□</span>
保存デッキ
</button>

</div>
</div>

<div class="stat-grid">

<div class="stat">
<b id="homeCards">0</b>
<small>カード総数</small>
</div>

<div class="stat">
<b id="homeDeck">0</b>
<small>現在デッキ枚数</small>
</div>

<div class="stat">
<b id="homeSlots">0/5</b>
<small>保存デッキ</small>
</div>

</div>

</section>


<section id="searchView" class="hidden">

<div class="panel">

<input
id="searchBox"
class="searchbox"
type="search"
placeholder="カード名・カード番号で検索"
oninput="renderCards()">

<div class="filters">

<select id="filter1" onchange="renderCards()"></select>

<select id="filter2" onchange="renderCards()"></select>

<select id="filter3" onchange="renderCards()"></select>

</div>

</div>

<div class="stat-grid">

<div class="stat">
<b id="dbCount">0</b>
<small>カードDB</small>
</div>

<div class="stat">
<b id="hitCount">0</b>
<small>検索結果</small>
</div>

<div class="stat">
<b id="deckBadge">0</b>
<small>デッキ枚数</small>
</div>

</div>

<div class="section-title" style="margin-top:14px">
カード一覧
</div>

<div id="cardList" class="card-grid"></div>

</section>


<section id="deckView" class="hidden">

<div class="panel">

<input
id="deckName"
class="searchbox"
placeholder="デッキ名"
oninput="renameDeck()">

</div>

<div class="section-title">
デッキ画像一覧
</div>

<div id="deckGrid" class="deck-grid"></div>

<div class="panel" style="margin-top:14px">

<button class="btn primary" onclick="exportDeck()">
レシピ出力
</button>

<button class="btn" onclick="copyDeck()">
コピー
</button>

<button class="btn danger" onclick="clearDeck()">
全削除
</button>

<textarea id="deckText"></textarea>

</div>

</section>


<section id="savedView" class="hidden">

<div class="panel">

<div class="section-title">
保存デッキ
</div>

<div id="slotList"></div>

<button
class="btn primary"
style="width:100%;margin-top:10px"
onclick="newSlot()">

新しいデッキを作る

</button>

</div>

</section>


<section id="settingsView" class="hidden">

<div class="panel">

<div class="section-title">
表示設定
</div>

<select
id="themeSelect"
class="searchbox"
onchange="setTheme(this.value)">

<option value="system">
端末設定に合わせる
</option>

<option value="light">
ライトモード
</option>

<option value="dark">
ダークモード
</option>

</select>

</div>

<div class="panel">

<div class="section-title">
カードデータ
</div>

<div id="dbInfo"></div>

<button
class="btn danger"
style="margin-top:10px"
onclick="refreshDB()">

カードDBを最新版に更新

</button>

</div>

</section>

</main>


<nav class="bottom">

<button id="navHome" class="active" onclick="showView('home')">
<span>⌂</span>
ホーム
</button>

<button id="navSearch" onclick="showView('search')">
<span>⌕</span>
カード検索
</button>

<button id="navDeck" onclick="showView('deck')">
<span>▣</span>
デッキ編集
</button>

<button id="navSaved" onclick="showView('saved')">
<span>▤</span>
保存デッキ
</button>

<button id="navSettings" onclick="showView('settings')">
<span>⚙</span>
設定
</button>

</nav>


<div id="preview" class="preview" onclick="closePreviewBg(event)">

<div class="preview-box">

<button
class="btn"
style="float:right"
onclick="closePreview()">

✕ 閉じる

</button>

<img id="previewImage">

<div id="previewTitle" class="preview-title"></div>

<div id="previewMeta" class="meta" style="text-align:center"></div>

</div>
</div>


<script src="cards_loveca.js"></script>
<script src="cards_pokemon.js"></script>
<script src="cards_union.js"></script>

<script>

const DATA_VERSION=20;

const GAME={
loveca:{
name:"ラブカ",
accent:"#ff4f87",
target:60
},
pokemon:{
name:"ポケカ",
accent:"#1767d8",
target:60
},
union:{
name:"ユニアリ",
accent:"#df2028",
target:50
}
};

function bundled(){
return{
loveca:window.TCG_CARD_DATA?.loveca||[],
pokemon:window.TCG_CARD_DATA?.pokemon||[],
union:window.TCG_CARD_DATA?.union||[]
};
}

let db=bundled();

let currentGame=
localStorage.getItem("tdsGame")||
"loveca";

let state;

try{
state=JSON.parse(
localStorage.getItem("tdsDeckState")||
"{}"
);
}catch(e){
state={};
}

for(const g of Object.keys(GAME)){

if(!state[g]){

state[g]={
active:0,
slots:[
{
name:GAME[g].name+"デッキ",
cards:{}
}
]
};

}

}

function currentDeck(){

return state[currentGame]
.slots[
state[currentGame].active
];

}

function save(){

localStorage.setItem(
"tdsGame",
currentGame
);

localStorage.setItem(
"tdsDeckState",
JSON.stringify(state)
);

updateStats();

}

function esc(v){

return String(v??"")
.replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));

}

function js(v){

return String(v)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}

function imageOf(c){

const v=
c?.image||
c?.imageUrl||
c?.image_url||
"";

return /^https?:\/\//.test(v)
?v
:"";

}

function workOf(c){

return String(
c.work||
c.workName||
c.title||
c.series||
c.product||
""
);

}

function saleTitleOf(c){

return String(
c.saleTitle||
c.setName||
c.set_name||
c.product||
c.series||
""
);

}

function regulationOf(c){

return String(
c.regulation||
c.regulationMark||
c.regulation_mark||
""
);

}

function chooseGame(g){

currentGame=g;

document.documentElement.style
.setProperty(
"--accent",
GAME[g].accent
);

save();

document.querySelectorAll(
".game-card"
).forEach(x=>
x.classList.remove("active")
);

document.getElementById(
"game-"+g
).classList.add("active");

buildFilters();

renderCards();

renderDeck();

}

function buildFilters(){

const arr=db[currentGame]||[];

const f1=document.getElementById("filter1");
const f2=document.getElementById("filter2");
const f3=document.getElementById("filter3");

if(currentGame==="pokemon"){

fillSelect(
f1,
"全販売タイトル",
arr.map(saleTitleOf)
);

fillSelect(
f2,
"全レギュレーション",
arr.map(regulationOf)
);

fillSelect(
f3,
"全カード種類",
arr.map(c=>c.type)
);

}else if(currentGame==="union"){

fillSelect(
f1,
"全作品",
arr.map(workOf)
);

fillSelect(
f2,
"全カード種類",
arr.map(c=>c.type)
);

fillSelect(
f3,
"全レアリティ",
arr.map(c=>c.rarity)
);

}else{

fillSelect(
f1,
"全シリーズ",
arr.map(workOf)
);

fillSelect(
f2,
"全カード種類",
arr.map(c=>c.type)
);

fillSelect(
f3,
"全レアリティ",
arr.map(c=>c.rarity)
);

}

}

function fillSelect(el,label,values){

const old=el.value;

const unique=[
...new Set(
values
.map(x=>String(x||"").trim())
.filter(Boolean)
)
].sort(
(a,b)=>a.localeCompare(b,"ja")
);

el.innerHTML=
`<option value="">${label}</option>`+
unique.map(x=>
`<option value="${esc(x)}">${esc(x)}</option>`
).join("");

if(unique.includes(old)){
el.value=old;
}

}

function renderCards(){

const q=
document.getElementById(
"searchBox"
).value.toLowerCase();

const a=
document.getElementById(
"filter1"
).value;

const b=
document.getElementById(
"filter2"
).value;

const c=
document.getElementById(
"filter3"
).value;

const arr=db[currentGame]||[];

const filtered=
arr.filter(card=>{

const search=[
card.name,
card.id,
card.type,
workOf(card),
saleTitleOf(card),
regulationOf(card),
card.rarity
].join(" ").toLowerCase();

if(q&&!search.includes(q)){
return false;
}

if(currentGame==="pokemon"){

return(
(!a||saleTitleOf(card)===a)&&
(!b||regulationOf(card)===b)&&
(!c||card.type===c)
);

}

if(currentGame==="union"){

return(
(!a||workOf(card)===a)&&
(!b||card.type===b)&&
(!c||card.rarity===c)
);

}

return(
(!a||workOf(card)===a)&&
(!b||card.type===b)&&
(!c||card.rarity===c)
);

});

document.getElementById(
"dbCount"
).textContent=
arr.length;

document.getElementById(
"hitCount"
).textContent=
filtered.length;

document.getElementById(
"cardList"
).innerHTML=

filtered.length
?filtered.slice(0,300)
.map(cardHtml)
.join("")
:`<div class="panel">カードが見つかりません</div>`;

}

function cardHtml(card){

const img=imageOf(card);

const qty=
currentDeck()
.cards[card.id]||
0;

return`

<div class="card">

<div class="thumb">

${img?`

<img
src="${esc(img)}"
loading="lazy"
onclick="openPreview('${js(card.id)}')"
onerror="this.style.display='none'">

`:"画像なし"}

</div>

<div class="card-body">

<div class="card-name">
${esc(card.name)}
</div>

<div class="meta">
${esc(card.id)}
</div>

<div class="tags">

${currentGame==="pokemon"&&saleTitleOf(card)?`
<span class="tag">
${esc(saleTitleOf(card))}
</span>
`:""}

${currentGame==="pokemon"&&regulationOf(card)?`
<span class="tag">
Reg ${esc(regulationOf(card))}
</span>
`:""}

${currentGame==="union"&&workOf(card)?`
<span class="tag">
${esc(workOf(card))}
</span>
`:""}

${card.type?`
<span class="tag">
${esc(card.type)}
</span>
`:""}

</div>

<div class="actions">

${img?`
<button class="btn"
onclick="openPreview('${js(card.id)}')">
画像
</button>
`:""}

<button class="btn primary"
onclick="addCard('${js(card.id)}')">

＋追加 ${qty?`(${qty})`:""}

</button>

${qty?`
<button class="btn"
onclick="removeCard('${js(card.id)}')">
−
</button>
`:""}

</div>

</div>

</div>

`;

}

function addCard(id){

const d=currentDeck();

const now=d.cards[id]||0;

if(now>=4){

alert(
"このカードは4枚までです"
);

return;

}

d.cards[id]=now+1;

save();
renderCards();
renderDeck();

}

function removeCard(id){

const d=currentDeck();

if(!d.cards[id]){
return;
}

d.cards[id]--;

if(d.cards[id]<=0){
delete d.cards[id];
}

save();
renderCards();
renderDeck();

}

function renderDeck(){

const d=currentDeck();

document.getElementById(
"deckName"
).value=d.name;

const arr=db[currentGame]||[];

const entries=
Object.entries(d.cards)
.map(([id,qty])=>({

qty,

card:arr.find(
x=>String(x.id)===
String(id)
)

}))
.filter(x=>x.card);

document.getElementById(
"deckGrid"
).innerHTML=

entries.length

?entries.map(x=>{

const card=x.card;
const img=imageOf(card);

return`

<div class="deck-card">

<div class="deck-img"
onclick="${
img
?`openPreview('${js(card.id)}')`
:""
}">

${img?`

<img
src="${esc(img)}"
loading="lazy">

`:"画像なし"}

<span class="qty">
×${x.qty}
</span>

</div>

<div class="deck-name">
${esc(card.name)}
</div>

<div class="deck-controls">

<button
onclick="removeCard('${js(card.id)}')">
−
</button>

<b>${x.qty}</b>

<button
onclick="addCard('${js(card.id)}')">
＋
</button>

</div>

</div>

`;

}).join("")

:`<div class="panel">デッキにカードがありません</div>`;

updateStats();

}

function openPreview(id){

const card=
(db[currentGame]||[])
.find(
x=>String(x.id)===
String(id)
);

if(!card){
return;
}

const img=imageOf(card);

if(!img){
return;
}

document.getElementById(
"previewImage"
).src=img;

document.getElementById(
"previewTitle"
).textContent=
card.name||"";

document.getElementById(
"previewMeta"
).textContent=
card.id||"";

document.getElementById(
"preview"
).classList.add("show");

}

function closePreview(){

document.getElementById(
"preview"
).classList.remove("show");

}

function closePreviewBg(e){

if(e.target.id==="preview"){
closePreview();
}

}

function updateStats(){

const total=
Object.values(
currentDeck().cards
).reduce(
(a,b)=>a+b,
0
);

document.getElementById(
"homeCards"
).textContent=
(db[currentGame]||[])
.length;

document.getElementById(
"homeDeck"
).textContent=
total;

document.getElementById(
"homeSlots"
).textContent=
state[currentGame]
.slots.length+
"/5";

document.getElementById(
"topCardCount"
).textContent=
Object.values(db)
.reduce(
(a,b)=>a+b.length,
0
);

document.getElementById(
"topDeckCount"
).textContent=
total;

document.getElementById(
"deckBadge"
).textContent=
total;

}

function renameDeck(){

currentDeck().name=
document.getElementById(
"deckName"
).value;

save();

}

function exportDeck(){

const d=currentDeck();

const arr=db[currentGame]||[];

let text=
GAME[currentGame].name+
"\n"+
d.name+
"\n\n";

for(
const [id,qty]
of Object.entries(d.cards)
){

const card=
arr.find(
c=>String(c.id)===
String(id)
);

if(card){

text+=
qty+
" x "+
card.name+
" ("+
id+
")\n";

}

}

document.getElementById(
"deckText"
).value=text;

}

function copyDeck(){

exportDeck();

const t=
document.getElementById(
"deckText"
);

t.select();

document.execCommand("copy");

alert("コピーしました");

}

function clearDeck(){

if(!confirm(
"デッキを全削除しますか？"
)){
return;
}

currentDeck().cards={};

save();
renderDeck();

}

function renderSlots(){

const s=state[currentGame];

document.getElementById(
"slotList"
).innerHTML=

s.slots.map(
(slot,i)=>`

<div class="panel">

<b>${esc(slot.name)}</b>

<button
class="btn ${i===s.active?"primary":""}"
style="float:right"
onclick="openSlot(${i})">

${i===s.active?"編集中":"開く"}

</button>

</div>

`
).join("");

}

function newSlot(){

const s=state[currentGame];

if(s.slots.length>=5){

alert(
"保存デッキは5個までです"
);

return;

}

s.slots.push({

name:
GAME[currentGame].name+
"デッキ "+
(s.slots.length+1),

cards:{}

});

s.active=
s.slots.length-1;

save();
renderSlots();
renderDeck();

}

function openSlot(i){

state[currentGame].active=i;

save();
renderSlots();
renderDeck();

}

function refreshDB(){

db=bundled();

localStorage.setItem(
"tdsDataVersion",
String(DATA_VERSION)
);

buildFilters();
renderCards();
renderDeck();

alert(
"カードDBを更新しました"
);

}

function showView(view){

for(
const x of[
"home",
"search",
"deck",
"saved",
"settings"
]
){

document.getElementById(
x+"View"
).classList.toggle(
"hidden",
x!==view
);

document.getElementById(
"nav"+
x[0].toUpperCase()+
x.slice(1)
).classList.toggle(
"active",
x===view
);

}

if(view==="search"){
renderCards();
}

if(view==="deck"){
renderDeck();
}

if(view==="saved"){
renderSlots();
}

if(view==="settings"){

document.getElementById(
"dbInfo"
).textContent=

"ラブカ "+
db.loveca.length+
"件 / ポケカ "+
db.pokemon.length+
"件 / ユニアリ "+
db.union.length+
"件";

}

}

function applyTheme(mode){

const dark=
mode==="dark"||
(
mode==="system"&&
window.matchMedia(
"(prefers-color-scheme: dark)"
).matches
);

document.documentElement
.setAttribute(
"data-theme",
dark?"dark":"light"
);

}

function setTheme(mode){

localStorage.setItem(
"tdsTheme",
mode
);

applyTheme(mode);

}

applyTheme(
localStorage.getItem(
"tdsTheme"
)||
"system"
);

chooseGame(currentGame);

updateStats();

</script>

</body>
</html>
