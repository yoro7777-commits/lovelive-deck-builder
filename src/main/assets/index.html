<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TCG Deck Studio</title>

<style>
:root{
  --bg:#f5f6fa;
  --surface:#ffffff;
  --surface2:#f0f2f6;
  --text:#202124;
  --muted:#737985;
  --line:#e2e5eb;
  --accent:#ff4f87;
  --danger:#d6404b;
  --shadow:0 4px 16px #00000012;
}

html[data-theme="dark"]{
  --bg:#101217;
  --surface:#191c23;
  --surface2:#252933;
  --text:#f5f6f8;
  --muted:#a8aeba;
  --line:#303642;
  --shadow:0 4px 16px #00000055;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================
   上部ヘッダー
========================= */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--surface);
  border-bottom:1px solid var(--line);

  padding-top:
    max(
      4px,
      env(safe-area-inset-top)
    );
}

.top{
  min-height:54px;
  max-width:1100px;
  margin:auto;
  padding:6px 10px;
  display:flex;
  align-items:center;
  gap:8px;
}

.appmark{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:11px;
  background:linear-gradient(135deg,#181b37,#e62e3c);
  color:#fff;
  display:grid;
  place-items:center;
  text-align:center;
  font-weight:900;
  font-size:9px;
  line-height:1.05;
}

.top-title{
  flex:1;
  min-width:0;
}

.top-title h1{
  margin:0;
  font-size:17px;
  line-height:1.15;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.top-title small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.top-stat{
  text-align:center;
  border-radius:10px;
  background:var(--surface2);
  padding:4px 7px;
  min-width:48px;
}

.top-stat small{
  display:block;
  font-size:8px;
  color:var(--muted);
}

.top-stat b{
  font-size:12px;
}

/* =========================
   共通
========================= */

main{
  max-width:1100px;
  margin:auto;
  padding:10px;
}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:12px;
  margin-bottom:11px;
}

.section-title{
  font-size:16px;
  font-weight:900;
  margin-bottom:10px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:9px 11px;
  font-weight:800;
  background:var(--surface2);
  color:var(--text);
}

.btn.primary{
  color:#fff;
  background:var(--accent);
}

.btn.danger{
  color:#fff;
  background:var(--danger);
}

.btn.full{
  width:100%;
}

.hidden{
  display:none!important;
}

/* =========================
   戻るボタン
========================= */

.page-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}

.back-home{
  border:0;
  background:var(--surface);
  color:var(--text);
  border-radius:11px;
  padding:9px 11px;
  box-shadow:var(--shadow);
  font-weight:900;
  white-space:nowrap;
}

.page-title{
  flex:1;
  font-size:17px;
  font-weight:900;
}

/* =========================
   ゲーム選択
========================= */

.game-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.game-card{
  border:2px solid var(--line);
  border-radius:15px;
  background:var(--surface);
  padding:8px;
  text-align:center;
}

.game-card.active{
  border-color:var(--accent);
}

.game-icon{
  width:100%;
  max-width:110px;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:14px;
  box-shadow:0 3px 10px #0002;
  display:block;
  margin:0 auto;
}

.game-name{
  margin-top:6px;
  font-size:14px;
  font-weight:900;
}

.game-desc{
  color:var(--muted);
  font-size:9px;
  line-height:1.3;
  min-height:24px;
  margin-top:2px;
}

.game-card button{
  border:0;
  color:#fff;
  width:100%;
  border-radius:999px;
  padding:8px 4px;
  font-weight:900;
  margin-top:7px;
  font-size:11px;
}

.loveca-btn{background:#ff4f87}
.pokemon-btn{background:#1767d8}
.union-btn{background:#d7252e}

/* =========================
   クイックメニュー
========================= */

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.quick-btn{
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--surface);
  color:var(--text);
  padding:10px 3px;
  font-size:10px;
  font-weight:800;
  text-align:center;
}

.quick-btn .ico{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

/* =========================
   統計
========================= */

.stat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.stat{
  background:var(--surface);
  border-radius:13px;
  box-shadow:var(--shadow);
  padding:9px 4px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:17px;
}

.stat small{
  color:var(--muted);
  font-size:9px;
}

/* =========================
   検索
========================= */

.searchbox{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:11px;
  background:var(--surface);
  color:var(--text);
}

.filters{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
  margin-top:8px;
}

.filters select{
  width:100%;
  min-width:0;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 7px;
  background:var(--surface);
  color:var(--text);
  font-size:11px;
  text-overflow:ellipsis;
}

.filters select:last-child{
  grid-column:1/-1;
}

/* =========================
   カード一覧
========================= */

.card-grid{
  display:grid;
  gap:8px;
}

.card{
  display:flex;
  gap:9px;
  padding:9px;
  border-radius:14px;
  background:var(--surface);
  box-shadow:var(--shadow);
}

.thumb{
  width:72px;
  min-width:72px;
  aspect-ratio:5/7;
  border-radius:8px;
  overflow:hidden;
  background:var(--surface2);
  display:grid;
  place-items:center;
  color:var(--muted);
  font-size:9px;
  text-align:center;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.card-body{
  flex:1;
  min-width:0;
}

.card-name{
  font-size:14px;
  line-height:1.25;
  font-weight:900;
}

.meta{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
  word-break:break-word;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:5px;
}

.tag{
  max-width:100%;
  border-radius:999px;
  background:var(--surface2);
  padding:3px 6px;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:6px;
}

.actions .btn{
  padding:7px 8px;
  font-size:10px;
}

/* =========================
   デッキ
========================= */

.deck-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.deck-card{
  background:var(--surface);
  border-radius:11px;
  padding:6px;
  box-shadow:var(--shadow);
}

.deck-img{
  position:relative;
  aspect-ratio:5/7;
  border-radius:7px;
  overflow:hidden;
  background:var(--surface2);
  display:grid;
  place-items:center;
  color:var(--muted);
  font-size:9px;
}

.deck-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.qty{
  position:absolute;
  right:4px;
  bottom:4px;
  background:#000c;
  color:#fff;
  border-radius:999px;
  padding:3px 6px;
  font-size:10px;
  font-weight:900;
}

.deck-name{
  margin-top:4px;
  font-size:9px;
  line-height:1.25;
  font-weight:800;
  min-height:23px;
}

.deck-controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:4px;
  margin-top:4px;
}

.deck-controls button{
  border:0;
  border-radius:7px;
  width:27px;
  height:27px;
  background:var(--accent);
  color:#fff;
  font-weight:900;
}

/* =========================
   保存
========================= */

.slot-row{
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:8px;
  margin-top:7px;
}

.slot-row b{
  flex:1;
  font-size:12px;
}

/* =========================
   プレビュー
========================= */

.preview{
  position:fixed;
  z-index:1000;
  inset:0;
  background:#000d;
  display:none;
  align-items:center;
  justify-content:center;
  padding:
    max(14px,env(safe-area-inset-top))
    14px
    max(14px,env(safe-area-inset-bottom));
}

.preview.show{
  display:flex;
}

.preview-box{
  width:min(94vw,460px);
  max-height:92vh;
  overflow:auto;
  background:var(--surface);
  border-radius:16px;
  padding:11px;
}

.preview-top{
  display:flex;
  justify-content:flex-end;
  margin-bottom:7px;
}

.preview-box img{
  width:100%;
  max-height:72vh;
  object-fit:contain;
  display:block;
  border-radius:8px;
}

.preview-title{
  margin-top:8px;
  text-align:center;
  font-weight:900;
}

/* =========================
   下部ナビ
========================= */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:90;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:var(--surface);
  border-top:1px solid var(--line);

  padding-bottom:
    env(safe-area-inset-bottom);
}

.bottom button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:6px 2px 5px;
  font-size:9px;
}

.bottom button.active{
  color:var(--accent);
  font-weight:900;
}

.bottom .ico{
  display:block;
  font-size:18px;
  margin-bottom:1px;
}

textarea{
  width:100%;
  min-height:140px;
  margin-top:9px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  color:var(--text);
}

/* =========================
   画面幅
========================= */

@media(max-width:370px){

  .game-grid{
    grid-template-columns:repeat(3,1fr);
    gap:5px;
  }

  .game-card{
    padding:5px;
  }

  .game-name{
    font-size:12px;
  }

  .game-desc{
    display:none;
  }

  .game-card button{
    font-size:9px;
    padding:7px 2px;
  }

  .top-stat{
    display:none;
  }
}

@media(min-width:650px){

  .game-icon{
    max-width:150px;
  }

  .filters{
    grid-template-columns:repeat(3,1fr);
  }

  .filters select:last-child{
    grid-column:auto;
  }

  .card-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .deck-grid{
    grid-template-columns:repeat(5,1fr);
  }
}
</style>
</head>

<body>

<header>
<div class="top">

<div class="appmark">
TCG<br>DECK
</div>

<div class="top-title">
<h1>TCG Deck Studio</h1>
<small>ラブカ・ポケカ・ユニアリ対応</small>
</div>

<div class="top-stat">
<small>カード</small>
<b id="topCardCount">0</b>
</div>

<div class="top-stat">
<small>デッキ</small>
<b id="topDeckCount">0</b>
</div>

</div>
</header>

<main>

<!-- =====================
ホーム
===================== -->

<section id="homeView">

<div class="panel">

<div class="section-title">
ゲームを選択
</div>

<div class="game-grid">

<div id="game-loveca" class="game-card">

<img
class="game-icon"
src="game_loveca.png"
onerror="this.style.display='none'">

<div class="game-name" style="color:#ff4f87">
ラブカ
</div>

<div class="game-desc">
ラブライブ！オフィシャルカードゲーム
</div>

<button
class="loveca-btn"
onclick="chooseGame('loveca')">

選択

</button>

</div>


<div id="game-pokemon" class="game-card">

<img
class="game-icon"
src="game_pokemon.png"
onerror="this.style.display='none'">

<div class="game-name" style="color:#1767d8">
ポケカ
</div>

<div class="game-desc">
ポケモンカードゲーム
</div>

<button
class="pokemon-btn"
onclick="chooseGame('pokemon')">

選択

</button>

</div>


<div id="game-union" class="game-card">

<img
class="game-icon"
src="game_union.png"
onerror="this.style.display='none'">

<div class="game-name" style="color:#d7252e">
ユニアリ
</div>

<div class="game-desc">
UNION ARENA
</div>

<button
class="union-btn"
onclick="chooseGame('union')">

選択

</button>

</div>

</div>
</div>


<div class="panel">

<div class="section-title">
クイックメニュー
</div>

<div class="quick-grid">

<button
class="quick-btn"
onclick="showView('search')">

<span class="ico">⌕</span>
検索

</button>

<button
class="quick-btn"
onclick="showView('deck')">

<span class="ico">▣</span>
デッキ

</button>

<button
class="quick-btn"
onclick="exportDeck();showView('deck')">

<span class="ico">▤</span>
出力

</button>

<button
class="quick-btn"
onclick="showView('saved')">

<span class="ico">□</span>
保存

</button>

</div>
</div>


<div class="stat-grid">

<div class="stat">
<b id="homeCards">0</b>
<small>カード</small>
</div>

<div class="stat">
<b id="homeDeck">0</b>
<small>デッキ枚数</small>
</div>

<div class="stat">
<b id="homeSlots">0/5</b>
<small>保存</small>
</div>

</div>

</section>


<!-- =====================
検索
===================== -->

<section id="searchView" class="hidden">

<div class="page-head">

<button
class="back-home"
onclick="showView('home')">

← ホーム

</button>

<div class="page-title">
カード検索
</div>

</div>


<div class="panel">

<input
id="searchBox"
class="searchbox"
type="search"
placeholder="カード名・カード番号で検索"

<div class="filters">

<select
id="filter1"
onchange="renderCards()">
</select>

<select
id="filter2"
onchange="renderCards()">
</select>

<select
id="filter3"
onchange="renderCards()">
</select>

</div>

</div>


<div class="stat-grid">

<div class="stat">
<b id="dbCount">0</b>
<small>カードDB</small>
</div>

<div class="stat">
<b id="hitCount">0</b>
<small>検索結果</small>
</div>

<div class="stat">
<b id="deckBadge">0</b>
<small>デッキ</small>
</div>

</div>


<div class="section-title" style="margin-top:13px">
カード一覧
</div>

id="cardList"
class="card-grid">
</div>

</section>


<!-- =====================
デッキ
===================== -->

<section id="deckView" class="hidden">

<button
class="back-home"
onclick="showView('home')">

← ホーム

</button>

デッキ編集
</div>

</div>


<div class="panel">

<input
id="deckName"
class="searchbox"

デッキ画像一覧

<button
class="btn primary"

レシピ出力

</button>

<button

コピー

</button>

<button
class="btn danger"

全削除

</button>

<textarea id="deckText"></textarea>

</div>

</section>


<!-- =====================
保存
===================== -->

<section id="savedView" class="hidden">

<div class="page-head">

<button
class="back-home"
onclick="showView('home')">

← ホーム

</button>

<div class="page-title">
保存デッキ
</div>

</div>


<div class="panel">

<div id="slotList"></div>

<button
class="btn primary full"
style="margin-top:9px"
onclick="newSlot()">

＋ 新しいデッキ

</button>

</div>

</section>


<!-- =====================
設定
===================== -->

<section id="settingsView" class="hidden">

<div class="page-head">

<button
class="back-home"
onclick="showView('home')">

← ホーム

</button>

<div class="page-title">
設定
</div>

</div>


<div class="panel">

<div class="section-title">
表示設定
</div>

<select
id="themeSelect"
class="searchbox"
onchange="setTheme(this.value)">

<option value="system">
端末設定
</option>

<option value="light">
ライト
</option>

<option value="dark">
ダーク
</option>

</select>

</div>


<div class="panel">

<div class="section-title">
カードデータ
</div>

<div
id="dbInfo"
class="meta">
</div>

<button
class="btn danger full"
style="margin-top:9px"
onclick="refreshDB()">

カードDBを最新版に更新

</button>

</div>

</section>

</main>


<!-- =====================
下部ナビ
===================== -->

<nav class="bottom">

<button
id="navHome"
class="active"
onclick="showView('home')">

<span class="ico">⌂</span>
ホーム

</button>

<button
id="navSearch"
onclick="showView('search')">

<span class="ico">⌕</span>
検索

</button>

<button
id="navDeck"
onclick="showView('deck')">

<span class="ico">▣</span>
デッキ

</button>

<button
id="navSaved"
onclick="showView('saved')">

<span class="ico">▤</span>
保存

</button>

<button
id="navSettings"
onclick="showView('settings')">

<span class="ico">⚙</span>
設定

</button>

</nav>


<!-- =====================
画像プレビュー
===================== -->

<div
id="preview"
class="preview"
onclick="closePreviewBg(event)">

<div class="preview-box">

<div class="preview-top">

<button
class="btn"
onclick="closePreview()">

✕ 閉じる

</button>

</div>

<img id="previewImage">

<div
id="previewTitle"
class="preview-title">
</div>

<div
id="previewMeta"
class="meta"
style="text-align:center">
</div>

</div>

</div>

<script src="cards_pokemon.js"></script>
<script src="cards_union.js"></script>

<script>

const DATA_VERSION = 21;

const GAME = {

  loveca:{
    name:"ラブカ",
    accent:"#ff4f87",
    target:60
  },

  pokemon:{
    name:"ポケカ",
    accent:"#1767d8",
    target:60
  },

  union:{
    name:"ユニアリ",
    accent:"#d7252e",
    target:50
  }

};


function bundled(){

  return {

    loveca:
      window.TCG_CARD_DATA?.loveca || [],

    pokemon:
      window.TCG_CARD_DATA?.pokemon || [],

    union:
      window.TCG_CARD_DATA?.union || []

  };

}


let db = bundled();


let currentGame =
  localStorage.getItem("tdsGame")
  || "loveca";


let state;

try{

  state = JSON.parse(
    localStorage.getItem(
      "tdsDeckState"
    )
    || "{}"
  );

}catch(e){

  state = {};

}


for(const g of Object.keys(GAME)){

  if(!state[g]){

    state[g] = {

      active:0,

      slots:[
        {
          name:
            GAME[g].name
            + "デッキ",

          cards:{}
        }
      ]

    };

  }

}


function currentDeck(){

  const s =
    state[currentGame];

  if(!s.slots[s.active]){

    s.active = 0;

  }

  return s.slots[s.active];

}


function save(){

  localStorage.setItem(
    "tdsGame",
    currentGame
  );

  localStorage.setItem(
    "tdsDeckState",
    JSON.stringify(state)
  );

  updateStats();

}


function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      c=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

}


function js(v){

  return String(v)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


function imageOf(c){

  const value =
    c?.image ||
    c?.imageUrl ||
    c?.image_url ||
    "";

  if(
    typeof value !== "string"
  ){
    return "";
  }

  const image =
    value.trim();

  return /^https?:\/\//.test(image)
    ? image
    : "";

}


function workOf(c){

  return String(
    c?.work ||
    c?.workName ||
    c?.title ||
    c?.series ||
    c?.product ||
    ""
  ).trim();

}


function saleTitleOf(c){

  return String(
    c?.saleTitle ||
    c?.setName ||
    c?.set_name ||
    c?.product ||
    c?.series ||
    ""
  ).trim();

}


function regulationOf(c){

  return String(
    c?.regulation ||
    c?.regulationMark ||
    c?.regulation_mark ||
    ""
  ).trim();

}


function chooseGame(game){

  currentGame = game;

  document.documentElement
    .style
    .setProperty(
      "--accent",
      GAME[game].accent
    );

  localStorage.setItem(
    "tdsGame",
    game
  );

  document
    .querySelectorAll(
      ".game-card"
    )
    .forEach(
      x=>
        x.classList
        .remove("active")
    );

  const selected =
    document.getElementById(
      "game-"+game
    );

  if(selected){

    selected.classList
      .add("active");

  }

  buildFilters();

  renderCards();

  renderDeck();

  renderSlots();

  updateStats();

}


function fillSelect(
  element,
  label,
  values
){

  const old =
    element.value;

  const unique =
    [
      ...new Set(
        values
        .map(
          x=>
            String(x || "")
            .trim()
        )
        .filter(Boolean)
      )
    ]
    .sort(
      (a,b)=>
        a.localeCompare(
          b,
          "ja"
        )
    );

  element.innerHTML =

    `<option value="">
      ${label}
    </option>`

    +

    unique.map(
      x=>
        `<option value="${esc(x)}">
          ${esc(x)}
        </option>`
    )
    .join("");

  if(
    unique.includes(old)
  ){

    element.value = old;

  }

}


function buildFilters(){

  const arr =
    db[currentGame] || [];

  const f1 =
    document.getElementById(
      "filter1"
    );

  const f2 =
    document.getElementById(
      "filter2"
    );

  const f3 =
    document.getElementById(
      "filter3"
    );


  if(currentGame==="pokemon"){

    fillSelect(
      f1,
      "販売タイトル",
      arr.map(saleTitleOf)
    );

    fillSelect(
      f2,
      "レギュレーション",
      arr.map(regulationOf)
    );

    fillSelect(
      f3,
      "カード種類",
      arr.map(c=>c.type)
    );

  }

  else if(currentGame==="union"){

    fillSelect(
      f1,
      "作品名",
      arr.map(workOf)
    );

    fillSelect(
      f2,
      "カード種類",
      arr.map(c=>c.type)
    );

    fillSelect(
      f3,
      "レアリティ",
      arr.map(c=>c.rarity)
    );

  }

  else{

    fillSelect(
      f1,
      "シリーズ",
      arr.map(workOf)
    );

    fillSelect(
      f2,
      "カード種類",
      arr.map(c=>c.type)
    );

    fillSelect(
      f3,
      "レアリティ",
      arr.map(c=>c.rarity)
    );

  }

}


function renderCards(){

  const q =
    (
      document.getElementById(
        "searchBox"
      ).value || ""
    )
    .toLowerCase();

  const a =
    document.getElementById(
      "filter1"
    ).value;

  const b =
    document.getElementById(
      "filter2"
    ).value;

  const c =
    document.getElementById(
      "filter3"
    ).value;

  const arr =
    db[currentGame] || [];


  const filtered =
    arr.filter(card=>{

      const text = [

        card.name,
        card.id,
        card.type,
        workOf(card),
        saleTitleOf(card),
        regulationOf(card),
        card.rarity

      ]
      .join(" ")
      .toLowerCase();


      if(
        q &&
        !text.includes(q)
      ){
        return false;
      }


      if(
        currentGame==="pokemon"
      ){

        return (

          (!a ||
            saleTitleOf(card)===a)

          &&

          (!b ||
            regulationOf(card)===b)

          &&

          (!c ||
            card.type===c)

        );

      }


      if(
        currentGame==="union"
      ){

        return (

          (!a ||
            workOf(card)===a)

          &&

          (!b ||
            card.type===b)

          &&

          (!c ||
            card.rarity===c)

        );

      }


      return (

        (!a ||
          workOf(card)===a)

        &&

        (!b ||
          card.type===b)

        &&

        (!c ||
          card.rarity===c)

      );

    });


  document.getElementById(
    "dbCount"
  ).textContent =
    arr.length;

  document.getElementById(
    "hitCount"
  ).textContent =
    filtered.length;


  document.getElementById(
    "cardList"
  ).innerHTML =

    filtered.length

    ? filtered
        .slice(0,250)
        .map(cardHtml)
        .join("")

    : `
      <div class="panel">
        該当カードがありません
      </div>
    `;


  updateStats();

}


function cardHtml(card){

  const image =
    imageOf(card);

  const qty =
    currentDeck()
    .cards[card.id] || 0;

  const work =
    workOf(card);


  return `

    <div class="card">

      <div class="thumb">

        ${
          image
          ? `
            <img
              src="${esc(image)}"
              loading="lazy"
              onclick="
                openPreview(
                  '${js(card.id)}'
                )
              "
              onerror="
                this.style.display='none';
              ">
          `
          : "画像なし"
        }

      </div>


      <div class="card-body">

        <div class="card-name">
          ${esc(card.name)}
        </div>

        <div class="meta">
          ${esc(card.id)}
        </div>


        <div class="tags">

          ${
            currentGame==="pokemon"
            &&
            saleTitleOf(card)
            ? `
              <span class="tag">
                ${esc(
                  saleTitleOf(card)
                )}
              </span>
            `
            : ""
          }


          ${
            currentGame==="pokemon"
            &&
            regulationOf(card)
            ? `
              <span class="tag">
                Reg ${esc(
                  regulationOf(card)
                )}
              </span>
            `
            : ""
          }


          ${
            currentGame==="union"
            &&
            work
            ? `
              <span class="tag">
                ${esc(work)}
              </span>
            `
            : ""
          }


          ${
            card.type
            ? `
              <span class="tag">
                ${esc(card.type)}
              </span>
            `
            : ""
          }

        </div>


        <div class="actions">

          ${
            image
            ? `
              <button
                class="btn"
                onclick="
                  openPreview(
                    '${js(card.id)}'
                  )
                ">
                画像
              </button>
            `
            : ""
          }


          <button
            class="btn primary"
            onclick="
              addCard(
                '${js(card.id)}'
              )
            ">
            ＋追加
            ${qty ? `(${qty})` : ""}
          </button>


          ${
            qty
            ? `
              <button
                class="btn"
                onclick="
                  removeCard(
                    '${js(card.id)}'
                  )
                ">
                −
              </button>
            `
            : ""
          }

        </div>

      </div>

    </div>

  `;

}


function addCard(id){

  const d =
    currentDeck();

  const now =
    d.cards[id] || 0;

  if(now >= 4){

    alert(
      "このカードは4枚までです"
    );

    return;

  }

  d.cards[id] =
    now + 1;

  save();

  renderCards();

  renderDeck();

}


function removeCard(id){

  const d =
    currentDeck();

  if(!d.cards[id]){
    return;
  }

  d.cards[id]--;

  if(
    d.cards[id] <= 0
  ){

    delete d.cards[id];

  }

  save();

  renderCards();

  renderDeck();

}


function renderDeck(){

  const d =
    currentDeck();

  document.getElementById(
    "deckName"
  ).value =
    d.name;


  const arr =
    db[currentGame] || [];


  const entries =
    Object.entries(
      d.cards
    )
    .map(
      ([id,qty])=>({

        qty,

        card:
          arr.find(
            x=>
              String(x.id)
              ===
              String(id)
          )

      })
    )
    .filter(
      x=>x.card
    );


  document.getElementById(
    "deckGrid"
  ).innerHTML =

    entries.length

    ? entries.map(
        x=>{

          const card =
            x.card;

          const image =
            imageOf(card);

          return `

            <div class="deck-card">

              <div
                class="deck-img"
                ${
                  image
                  ? `
                    onclick="
                      openPreview(
                        '${js(card.id)}'
                      )
                    "
                  `
                  : ""
                }>

                ${
                  image
                  ? `
                    <img
                      src="${esc(image)}"
                      loading="lazy">
                  `
                  : "画像なし"
                }

                <span class="qty">
                  ×${x.qty}
                </span>

              </div>

              <div class="deck-name">
                ${esc(card.name)}
              </div>

              <div class="deck-controls">

                <button
                  onclick="
                    removeCard(
                      '${js(card.id)}'
                    )
                  ">
                  −
                </button>

                <b>
                  ${x.qty}
                </b>

                <button
                  onclick="
                    addCard(
                      '${js(card.id)}'
                    )
                  ">
                  ＋
                </button>

              </div>

            </div>

          `;

        }
      )
      .join("")

    : `
      <div
        class="panel"
        style="grid-column:1/-1">
        デッキにカードがありません
      </div>
    `;


  updateStats();

}


function openPreview(id){

  const card =
    (
      db[currentGame]
      || []
    )
    .find(
      x=>
        String(x.id)
        ===
        String(id)
    );

  if(!card){
    return;
  }


  const image =
    imageOf(card);

  if(!image){

    alert(
      "画像がありません"
    );

    return;

  }


  document.getElementById(
    "previewImage"
  ).src =
    image;

  document.getElementById(
    "previewTitle"
  ).textContent =
    card.name || "";

  document.getElementById(
    "previewMeta"
  ).textContent =
    card.id || "";

  document.getElementById(
    "preview"
  ).classList
  .add("show");

}


function closePreview(){

  document.getElementById(
    "preview"
  ).classList
  .remove("show");

  document.getElementById(
    "previewImage"
  ).src = "";

}


function closePreviewBg(e){

  if(
    e.target.id==="preview"
  ){

    closePreview();

  }

}


function updateStats(){

  const total =
    Object.values(
      currentDeck().cards
    )
    .reduce(
      (a,b)=>a+b,
      0
    );


  document.getElementById(
    "homeCards"
  ).textContent =
    (
      db[currentGame]
      || []
    ).length;


  document.getElementById(
    "homeDeck"
  ).textContent =
    total;


  document.getElementById(
    "homeSlots"
  ).textContent =
    state[currentGame]
      .slots.length
    + "/5";


  document.getElementById(
    "topCardCount"
  ).textContent =
    Object.values(db)
    .reduce(
      (a,b)=>
        a+b.length,
      0
    );


  document.getElementById(
    "topDeckCount"
  ).textContent =
    total;


  document.getElementById(
    "deckBadge"
  ).textContent =
    total;

}


function renameDeck(){

  currentDeck().name =
    document.getElementById(
      "deckName"
    ).value
    ||
    GAME[currentGame].name
    + "デッキ";

  save();

}


function exportDeck(){

  const d =
    currentDeck();

  const arr =
    db[currentGame] || [];

  let text =
    GAME[currentGame].name
    + "\n"
    + d.name
    + "\n\n";


  for(
    const [id,qty]
    of Object.entries(d.cards)
  ){

    const card =
      arr.find(
        x=>
          String(x.id)
          ===
          String(id)
      );

    if(card){

      text +=
        qty
        + " x "
        + card.name
        + " ("
        + id
        + ")\n";

    }

  }


  document.getElementById(
    "deckText"
  ).value =
    text;

}


function copyDeck(){

  exportDeck();

  const t =
    document.getElementById(
      "deckText"
    );

  t.focus();

  t.select();

  try{

    document.execCommand(
      "copy"
    );

    alert(
      "コピーしました"
    );

  }catch(e){

    alert(
      "長押ししてコピーしてください"
    );

  }

}


function clearDeck(){

  if(
    !confirm(
      "デッキを全削除しますか？"
    )
  ){
    return;
  }

  currentDeck().cards = {};

  save();

  renderDeck();

  renderCards();

}


function renderSlots(){

  const s =
    state[currentGame];


  document.getElementById(
    "slotList"
  ).innerHTML =

    s.slots
    .map(
      (slot,i)=>`

        <div class="slot-row">

          <b>
            ${esc(slot.name)}
          </b>

          <button
            class="
              btn
              ${
                i===s.active
                ? "primary"
                : ""
              }
            "
            onclick="
              openSlot(${i})
            ">

            ${
              i===s.active
              ? "編集中"
              : "開く"
            }

          </button>

        </div>

      `
    )
    .join("");

}


function newSlot(){

  const s =
    state[currentGame];

  if(
    s.slots.length >= 5
  ){

    alert(
      "保存デッキは5個までです"
    );

    return;

  }


  s.slots.push({

    name:
      GAME[currentGame].name
      + "デッキ "
      + (
        s.slots.length + 1
      ),

    cards:{}

  });


  s.active =
    s.slots.length - 1;

  save();

  renderSlots();

  renderDeck();

}


function openSlot(i){

  state[currentGame]
    .active =
    i;

  save();

  renderSlots();

  renderDeck();

}


function refreshDB(){

  db = bundled();

  localStorage.setItem(
    "tdsDataVersion",
    String(DATA_VERSION)
  );

  buildFilters();

  renderCards();

  renderDeck();

  updateStats();

  alert(
    "カードDBを更新しました"
  );

}


function showView(view){

  const pages = [
    "home",
    "search",
    "deck",
    "saved",
    "settings"
  ];


  pages.forEach(
    x=>{

      const section =
        document.getElementById(
          x+"View"
        );

      if(section){

        section.classList
        .toggle(
          "hidden",
          x!==view
        );

      }


      const nav =
        document.getElementById(
          "nav"
          + x[0]
            .toUpperCase()
          + x.slice(1)
        );

      if(nav){

        nav.classList
        .toggle(
          "active",
          x===view
        );

      }

    }
  );


  window.scrollTo(
    {
      top:0,
      behavior:"smooth"
    }
  );


  if(view==="search"){

    buildFilters();

    renderCards();

  }


  if(view==="deck"){

    renderDeck();

  }


  if(view==="saved"){

    renderSlots();

  }


  if(view==="settings"){

    document.getElementById(
      "dbInfo"
    ).textContent =

      "ラブカ "
      + db.loveca.length
      + "件 / ポケカ "
      + db.pokemon.length
      + "件 / ユニアリ "
      + db.union.length
      + "件";


    document.getElementById(
      "themeSelect"
    ).value =

      localStorage.getItem(
        "tdsTheme"
      )
      || "system";

  }

}


function applyTheme(mode){

  const dark =

    mode==="dark"

    ||

    (
      mode==="system"

      &&

      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches
    );


  document.documentElement
    .setAttribute(
      "data-theme",
      dark
      ? "dark"
      : "light"
    );

}


function setTheme(mode){

  localStorage.setItem(
    "tdsTheme",
    mode
  );

  applyTheme(mode);

}


applyTheme(
  localStorage.getItem(
    "tdsTheme"
  )
  || "system"
);


document.documentElement
  .style
  .setProperty(
    "--accent",
    GAME[currentGame].accent
  );


chooseGame(
  currentGame
);

showView(
  "home"
);

</script>
